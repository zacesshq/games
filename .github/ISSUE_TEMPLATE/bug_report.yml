name: Bug report
description: A game plays wrongly, a key does not work, a level will not load or the terminal is left in a bad state.
labels: ["bug"]
body:
  - type: dropdown
    id: game
    attributes:
      label: Game
      description: Pick the game you were playing.
      multiple: true
      options:
        - Stackline
        - Merge Gates
        - Termle
        - Signal
        - Trace
        - Drift
        - Rooms
        - Relay
        - Through Ball
        - Slipstream
        - Array Guard
        - Heatsink
        - Touch Typing
        - Learn to Code
        - A Lua level of my own
        - Every game
        - Not about a game
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      multiple: true
      options:
        - Zacess Light
        - Zacess Dark
        - Zacess Yellow on Black
        - Zacess Cream
        - Zacess High Contrast Dark
        - Zacess High Contrast Light
        - Zacess Deep Contrast Dark
        - Zacess Deep Contrast Light
        - Zacess Warm Dark
        - Zacess Warm Light
        - NO_COLOR
  - type: dropdown
    id: terminal
    attributes:
      label: Terminal
      options:
        - Terminal.app
        - iTerm2
        - kitty
        - Alacritty
        - Ghostty
        - Windows Terminal
        - GNOME Terminal
        - Konsole
        - Warp
        - tmux or screen
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw or heard, including any error message. A screenshot or a pasted frame helps if you can share one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact command and the level or round help most.
      placeholder: |
        1. Start the game with the theme set to Zacess Cream
        2. Pause with Space and resize the window to 40 columns
        3. ...
    validations:
      required: true
  - type: dropdown
    id: sound
    attributes:
      label: Is it about sound or music?
      options:
        - "No"
        - Sound effects
        - Music
        - Both
  - type: input
    id: version
    attributes:
      label: Version and system
      description: The game's version, the operating system and the terminal version.
      placeholder: 1.0.0, macOS 26, Ghostty 1.2
  - type: dropdown
    id: ai-use
    attributes:
      label: AI use
      description: "Required. Did AI help you find, test or check this? Write the title and description yourself either way. See the [AI policy](https://github.com/zacesshq/.github/blob/main/AI_POLICY.md). Dictation, translation and spelling tools do not count."
      options:
        - No AI was used
        - "Yes: AI helped me find, test or check it"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I have read the [Code of Conduct](https://github.com/zacesshq/games/blob/main/CODE_OF_CONDUCT.md).
          required: true
