name: Accessibility problem
description: Something in a game is hard to see, moves too much, flashes, relies on sound alone or cannot be played with your setup.
labels: ["accessibility"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for telling us. We treat an accessibility problem as a bug. You never need to share a diagnosis or anything personal: describe what happened and we will work from that. If you would rather report privately, email contact@zacess.com.
  - type: dropdown
    id: game
    attributes:
      label: Game
      multiple: true
      options:
        - Stackline
        - Merge Gates
        - Termle
        - Signal
        - Trace
        - Drift
        - Rooms
        - Relay
        - Through Ball
        - Slipstream
        - Array Guard
        - Heatsink
        - Touch Typing
        - Learn to Code
        - A Lua level of my own
        - Every game
        - The how-to-play page or the keys
        - The guides in docs
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      multiple: true
      options:
        - Zacess Light
        - Zacess Dark
        - Zacess Yellow on Black
        - Zacess Cream
        - Zacess High Contrast Dark
        - Zacess High Contrast Light
        - Zacess Deep Contrast Dark
        - Zacess Deep Contrast Light
        - NO_COLOR
  - type: dropdown
    id: area
    attributes:
      label: What it affects
      multiple: true
      options:
        - Colour or contrast
        - Flashing or too much motion
        - Sound or music
        - Speed or time limits
        - Keys or controls
        - Text size or layout
        - Screen reader output
        - Something else
  - type: textarea
    id: barrier
    attributes:
      label: What got in the way
      description: What was hard to see, moved too much, flashed or could only be heard. If the game did something to your terminal, say what. Tell us what would have worked for you if you know.
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Settings you were using (optional)
      description: Whether reduced motion was on (the flag, the variable or the system setting), the volumes, mute and anything that changes how colours look, such as a colour filter or inverted colours.
      placeholder: ZACESS_REDUCED_MOTION=1, macOS Reduce Motion on, music muted, 150% zoom
  - type: input
    id: assistive-tech
    attributes:
      label: Assistive technology used (optional)
      description: Screen reader, magnifier, switch access, voice control or settings such as high contrast or larger text, with versions if you know them.
      placeholder: VoiceOver on macOS 26 in Terminal.app
  - type: input
    id: version
    attributes:
      label: Version and terminal (optional)
      placeholder: 0.1.0, Windows Terminal 1.23
