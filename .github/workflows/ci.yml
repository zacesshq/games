name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  detect:
    # the games' code arrives later, so every Rust job is skipped until a Cargo.toml exists
    name: Look for a Cargo project
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cargo: ${{ steps.find.outputs.cargo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: find
        env:
          FOUND: ${{ hashFiles('Cargo.toml') != '' }}
        run: |
          echo "cargo=$FOUND" >> "$GITHUB_OUTPUT"
          if [ "$FOUND" = "true" ]; then
            echo "Cargo.toml found, so the Rust checks run."
          else
            echo "No Cargo.toml yet, so the Rust checks are skipped."
          fi

  check:
    name: ${{ matrix.name }}
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  release-targets:
    # the release builds compile Lua from source with each target's C compiler, so the targets
    # that differ most from the check jobs are built on each pull request rather than first
    # meeting them at a release
    name: Release build ${{ matrix.target }}
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Set up the musl cross toolchain
        if: contains(matrix.target, 'musl')
        uses: taiki-e/setup-cross-toolchain-action@12b7ad4acfa95a1476779d6c06699b96ec1691f8 # v1.42.0
        with:
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
