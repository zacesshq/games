name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Check the stills and showcase frames are current
        if: runner.os == 'Linux'
        run: |
          ./scripts/snapshots.sh
          git status --porcelain docs/images docs/frames
          git diff --exit-code docs/images docs/frames
          test -z "$(git status --porcelain docs/images docs/frames)"
      - name: Play every game without a terminal
        shell: bash
        run: |
          cargo build -q
          bin=target/debug/zacess-games
          [ -x "$bin" ] || bin="$bin.exe"
          export ZACESS_GAMES_STATE="$PWD/target/ci-state"
          export ZACESS_GAMES_NO_USER_LEVELS=1
          "$bin" --version
          for game in $("$bin" list | awk '{print $1}'); do
            for size in 60x20 100x30 160x45; do
              screen=$("$bin" --headless "$game" --keys right,enter,wait:1 --size "$size" --seed 1)
              [ -n "$screen" ] || { echo "$game at $size drew nothing"; exit 1; }
            done
            echo "::group::$game at 100x30"
            "$bin" --headless "$game" --size 100x30 --seed 1
            echo "::endgroup::"
          done

  release-targets:
    # the release builds compile Lua from source with each target's C compiler, so every
    # target is built on each pull request rather than first meeting it at a release
    name: Release build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Set up the musl cross toolchain
        if: contains(matrix.target, 'musl')
        uses: taiki-e/setup-cross-toolchain-action@12b7ad4acfa95a1476779d6c06699b96ec1691f8 # v1.42.0
        with:
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the rust-version in Cargo.toml, so a newer standard library API cannot slip in unseen
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --locked --all-targets
