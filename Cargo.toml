[package]
name = "zacess-games"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Fourteen original games for the terminal in the Zacess high contrast themes"
license = "MIT"
repository = "https://github.com/zacesshq/games"
homepage = "https://zacess.com"
readme = "README.md"
keywords = ["terminal", "game", "accessibility", "high-contrast", "typing"]
categories = ["games", "command-line-utilities", "accessibility"]
# zacess-scenes comes from a git tag, which crates.io does not accept, so the games install from here
publish = false

[[bin]]
name = "zacess-games"
path = "src/main.rs"

[dependencies]
# theme loading, palette roles with contrast floors, the flash meter, motion settings, frames and
# SVG stills all come from Scenes, so the games look and behave like the scenes do
zacess-scenes = { git = "https://github.com/zacesshq/scenes", tag = "v0.4.0" }
crossterm = "0.29"
# lua 5.4 built into the binary for the level files, the same build Scenes uses
mlua = { version = "0.11.6", default-features = false, features = ["lua54", "vendored"] }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
